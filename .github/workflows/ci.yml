name: 质量与安全门禁

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      release-test-postgres:
        image: postgres:17.5-alpine3.22
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      RELEASE_TEST_PGHOST: 127.0.0.1
      RELEASE_TEST_PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm run security:verify-vendor
      - run: npm ci
      - run: npm run lint -- --quiet
      - name: 初始化临时测试密钥并检查测试环境
        run: |
          echo "FIELD_ENCRYPTION_KEY=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")" >> "$GITHUB_ENV"
      - run: npm run check:release-test-environment
      - run: npm test -- --runInBand
      - run: npm run docs:check
      - run: python3 scripts/productionSourceGuard.py source
      - run: npm run test:release
      - run: npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: mkdir -p ../coverage/frontend-capabilities && cp -a dist ../coverage/frontend-capabilities/frontend
      - run: python3 ../scripts/productionSourceGuard.py frontend --root "$GITHUB_WORKSPACE" --release "$GITHUB_WORKSPACE/coverage/frontend-capabilities" --output "$GITHUB_WORKSPACE/coverage/frontend-capabilities/capabilities.json"
      - run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
