# 只保留官网出口探测的随机标记；普通查询参数、Referer 和身份资料不进日志。
map $request_uri $official_egress_probe {
    default "-";
    "~^/api/health/ready\?(?<official_egress_probe_token>http-rebuild-[0-9a-f]{32})$" $official_egress_probe_token;
}

log_format identity_internal_safe_20261016 '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent probe=$official_egress_probe';

server {
    listen 80;
    server_name apple.godp.me;

    access_log /var/log/nginx/apple-order-mgr-access.log identity_internal_safe_20261016;
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;

    # 身份接口的明文 HTTP 请求直接拒绝，禁止携带查询参数跳转。
    location ~* ^/api/internal/v1/identity {
        access_log off;
        error_log /dev/null crit;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 400;
    }

    location / { return 301 https://$server_name$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name apple.godp.me;

    access_log /var/log/nginx/apple-order-mgr-access.log identity_internal_safe_20261016;
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;

    # 保留生产既有身份接口保护：不记录查询参数、不缓存、不重试。
    location ~* ^/api/internal/v1/identity {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer "";
        proxy_cache off;
        proxy_store off;
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SSL 证书配置
    ssl_certificate /etc/letsencrypt/live/apple.godp.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apple.godp.me/privkey.pem;

    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端静态文件
    location / {
        root /var/www/apple-order-mgr/current/frontend;
        try_files $uri $uri/ /index.html;

        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 兼容历史付款截图 URL；完成鉴权下载接口后应移除此公开别名。
    location /uploads/ {
        alias /var/www/apple-order-mgr/uploads/;
        expires 1h;
        add_header Cache-Control "private, no-store";
    }

    # 客户端上传大小限制
    client_max_body_size 50M;
}
